name: web-sdk-react

on:
  pull_request:
    paths:
      - 'web-sdk-react/**'
      - '.github/workflows/web-sdk-react.yml'
  push:
    branches: [master]
    paths:
      - 'web-sdk-react/**'
      - '.github/workflows/web-sdk-react.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        type: choice
        options: [staging, production]
      version:
        description: 'Release version for production, e.g. 2.0.0'
        required: false
        type: string

defaults:
  run:
    working-directory: web-sdk-react

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: web-sdk-react/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

  image:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like 2.0.0"; exit 1; }
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=staging-${GITHUB_SHA::8}-$(date +%s)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web-sdk-react
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/sdk-demo:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
